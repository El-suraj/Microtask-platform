version: "3.9"

services:
  api:
    build: .
    container_name: my_api
    ports:
      - "3000:5000"
    env_file:
      - .env
    restart: always
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: my_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:

